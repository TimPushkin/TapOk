name: Package

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: "${{ secrets.Keystore }}"
        run: |
          STORE_FILE="$RUNNER_TEMP/tapok.jks"
          echo -n "$KEYSTORE_BASE64" | base64 -d > "$STORE_FILE"
          echo "STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"

      - name: Package
        env:
          STORE_PASSWORD: "${{ secrets.StorePassword }}"
          KEY_ALIAS: "${{ secrets.KeyAlias }}"
          KEY_PASSWORD: "${{ secrets.KeyPassword }}"
        run: ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
